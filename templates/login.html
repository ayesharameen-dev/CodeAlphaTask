<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident Commander — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-label="Incident Commander">
        <i></i><b></b>
      </div>
      <header class="hero-copy">
        <h1 id="page-title">Welcome Back</h1>
        <p>Log in to your AI Incident Commander account</p>
      </header>

      {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
      {% endif %}

      <form action="{{ url_for('login') }}" method="post">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 6.5h17v12h-17zM3.5 7l8.5 6 8.5-6"/></svg>
          <input id="email" name="username" type="email" placeholder="you@company.com" autocomplete="email" required>
        </div>

        <label for="password">Password</label>
        <div class="input-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <a class="forgot-link" href="#">Forgot password?</a>

        <button class="submit-button" type="submit">Log In <span aria-hidden="true">→</span></button>
      </form>

      <div class="divider"><span>OR CONTINUE WITH</span></div>
      <div class="provider-row">
        <button class="provider-button" type="button"><span class="google-icon">G</span> Google</button>
        <button class="provider-button" type="button"><svg class="github-icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.44-2.43-.85-2.43-.85-.33-.84-.8-1.06-.8-1.06-.66-.45.05-.44.05-.44.73.05 1.12.75 1.12.75.65 1.11 1.7.79 2.11.61.07-.47.25-.79.46-.97-1.61-.18-3.3-.8-3.3-3.58 0-.79.28-1.43.75-1.94-.08-.18-.33-.92.07-1.92 0 0 .61-.2 2 .74A6.9 6.9 0 0 1 8 4.87c.61 0 1.22.08 1.79.24 1.39-.94 2-.74 2-.74.4 1 .15 1.74.07 1.92.47.51.75 1.15.75 1.94 0 2.79-1.7 3.39-3.32 3.57.26.22.49.64.49 1.29l-.01 1.91c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"/></svg> GitHub</button>
      </div>
      <p class="signup-copy">Don't have an account? <a href="#">Sign up</a></p>
    </section>
  </main>
  <script>
    const toggle = document.querySelector('.password-toggle');
    const password = document.querySelector('#password');
    toggle.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!visible));
      toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    });
  </script>
</body>
</html>
